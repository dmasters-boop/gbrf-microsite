<!DOCTYPE html>
<html class="staticrypt-html">

        <title>Great Barrier Reef Foundation × Salesforce</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        />

        <style>
            :root {
                --gbrf-navy: #04263b;
                --gbrf-navy-2: #063149;
                --sf-blue: #00a1e0;
                --sf-blue-dark: #0079ab;
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 0;
                background: var(--gbrf-navy);
                background-image: radial-gradient(
                        ellipse 90% 60% at 15% 0%,
                        rgba(0, 161, 224, 0.14) 0%,
                        transparent 55%
                    ),
                    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(0, 161, 224, 0.08) 0%, transparent 50%);
                font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                color: #ffffff;
            }

            .staticrypt-page {
                width: 400px;
                max-width: calc(100% - 32px);
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            /* Co-branded logo lockup */
            .gbrf-lockup {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 14px;
                margin-bottom: 26px;
            }
            .gbrf-lockup .gbrf-chip {
                display: inline-flex;
                align-items: center;
                background: #ffffff;
                border-radius: 8px;
                padding: 8px 12px;
            }
            .gbrf-lockup .gbrf-chip img {
                height: 34px;
                width: auto;
                display: block;
            }
            .gbrf-lockup .gbrf-x {
                color: rgba(255, 255, 255, 0.5);
                font-weight: 300;
                font-size: 18px;
            }
            .gbrf-lockup svg {
                width: 34px;
                height: 24px;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 16px;
                max-width: 400px;
                margin: 0 auto 100px;
                padding: 40px 36px;
                text-align: center;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
                backdrop-filter: blur(6px);
            }

            .staticrypt-instructions {
                margin-top: 0;
                margin-bottom: 1.25em;
            }

            .staticrypt-title {
                font-size: 1.5em;
                font-weight: 800;
                letter-spacing: -0.01em;
                margin: 0 0 0.35em;
                color: #ffffff;
            }

            .staticrypt-instructions p:not(.staticrypt-title) {
                margin: 0;
                font-size: 0.95em;
                line-height: 1.5;
                color: rgba(255, 255, 255, 0.6);
            }

            .staticrypt-hr {
                margin: 20px 0;
                border: 0;
                border-top: 1px solid rgba(255, 255, 255, 0.12);
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-radius: 9999px;
                width: 100%;
                margin: 0 0 16px;
                box-sizing: border-box;
                transition: border-color 0.15s ease, box-shadow 0.15s ease;
            }
            .staticrypt-password-container:focus-within {
                border-color: var(--sf-blue);
                box-shadow: 0 0 0 3px rgba(0, 161, 224, 0.25);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font-family: inherit;
                font-size: 15px;
                color: #ffffff;
                outline: 0;
                padding: 15px 46px 15px 20px;
                width: 100%;
            }
            .staticrypt-form input::placeholder {
                color: rgba(255, 255, 255, 0.45);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                padding: 13px;
                position: absolute;
                right: 4px;
                top: 50%;
                transform: translateY(-50%);
                /* the FontAwesome icons are black — invert so they read on the dark field */
                filter: invert(1);
                opacity: 0.55;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                letter-spacing: 0.06em;
                outline: 0;
                background: var(--sf-blue);
                width: 100%;
                border: 0;
                border-radius: 9999px;
                padding: 15px;
                color: #ffffff;
                font-family: inherit;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                transition: background 0.15s ease, transform 0.15s ease;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--sf-blue-dark);
                transform: translateY(-1px);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 1em;
                font-size: 0.85em;
                color: rgba(255, 255, 255, 0.6);
            }
            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.3);
                margin-right: 0.75em;
                accent-color: var(--sf-blue);
            }

            .gbrf-footnote {
                margin-top: 22px;
                font-size: 0.62rem;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: rgba(255, 255, 255, 0.3);
                text-align: center;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--gbrf-navy);
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid rgba(0, 161, 224, 0.35);
                border-right-color: var(--sf-blue);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>
